<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Phoenix - NCO Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="background-shapes"></div>
    <nav class="navbar">
        <div class="navbar-brand">AI Semantic Search</div>
        <div class="navbar-menu">
            <a href="#" class="navbar-item"><i class="fas fa-user-circle"></i> Login</a>
            <a href="#" class="navbar-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>
    <main class="container">
        <div id="initial-content" class="initial-content">
            <h1 class="typing-animation" id="typing-animation"></h1>
            <div class="rules-container">
                <p><i class="fas fa-check-circle"></i> Enter job titles or skills to find NCO codes.</p>
                <p><i class="fas fa-check-circle"></i> Click on a result to view its details.</p>
            </div>
        </div>
        <form id="search-form" class="search-container">
            <div class="search-bar-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search for a job title or skill..." autocomplete="off">
                <button type="submit">Search</button>
            </div>
        </form>
        <div id="loader" class="loader" style="display: none;"></div>
        
        <div id="query-correction-container" class="query-correction" style="display: none;"></div>
        
        <div id="results-container" class="results-container" style="display: none;"></div>
        <div id="details-container" class="details-container" style="display: none;"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');
            const initialContent = document.getElementById('initial-content');
            const resultsContainer = document.getElementById('results-container');
            const detailsContainer = document.getElementById('details-container');
            const loader = document.getElementById('loader');
            const correctionContainer = document.getElementById('query-correction-container');
            let allResults = [];

            const typingText = "Get your NCO Codes";
            const typingElement = document.getElementById('typing-animation');
            let i = 0;
            function typeWriter() {
                if (i < typingText.length) {
                    typingElement.innerHTML += typingText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 100);
                } else {
                    typingElement.classList.add('cursor-blink');
                }
            }
            typeWriter();

            searchForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                const query = searchInput.value.trim();
                if (!query) return;

                initialContent.style.display = 'none';
                resultsContainer.style.display = 'none';
                detailsContainer.style.display = 'none';
                correctionContainer.style.display = 'none'; // Hide previous corrections
                loader.style.display = 'block';

                try {
                    const response = await fetch('/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: query })
                    });

                    loader.style.display = 'none';
                    if (!response.ok) throw new Error('Search request failed.');

                    const data = await response.json();
                    
                    // ★★★ NEW FEATURE: Check for a corrected query ★★★
                    if (data.corrected_query) {
                        correctionContainer.innerHTML = `Showing results for: <strong>${data.corrected_query}</strong>`;
                        correctionContainer.style.display = 'block';
                    }

                    allResults = data.results;
                    displayResults(data.results);

                } catch (error) {
                    console.error('Error:', error);
                    loader.style.display = 'none';
                    resultsContainer.innerHTML = `<div class="error-message">Could not fetch results. Please try again.</div>`;
                    resultsContainer.style.display = 'block';
                }
            });

            function displayResults(results) {
                resultsContainer.innerHTML = '';
                if (results.length === 0) {
                    resultsContainer.innerHTML = `<div class="no-results">No relevant occupations found. Try a different query.</div>`;
                } else {
                    const list = document.createElement('ul');
                    results.forEach((result, index) => {
                        const item = document.createElement('li');
                        item.className = 'result-item';
                        item.dataset.index = index;
                        item.innerHTML = `
                            <div class="result-title">${result['Occupational Title']}</div>
                            <div class="result-details">
                                <span>Division: ${result['Division']}</span>
                                <span>Similarity: <strong>${result.similarity}</strong></span>
                            </div>
                        `;
                        item.addEventListener('click', () => showDetails(index));
                        list.appendChild(item);
                    });
                    resultsContainer.appendChild(list);
                }
                resultsContainer.style.display = 'block';
            }

            function showDetails(index) {
                const job = allResults[index];
                resultsContainer.style.display = 'none';
                correctionContainer.style.display = 'none'; // Also hide correction on detail view

                detailsContainer.innerHTML = `
                    <button id="back-button" class="back-button"><i class="fas fa-arrow-left"></i> Back to Results</button>
                    <div class="details-card">
                        <h2>${job['Occupational Title']}</h2>
                        <div class="details-grid">
                            ${Object.entries(job).map(([key, value]) => `<div class="detail-item"><strong>${key.replace(/_/g, ' ')}:</strong> ${value}</div>`).join('')}
                        </div>
                    </div>
                `;
                detailsContainer.style.display = 'block';

                document.getElementById('back-button').addEventListener('click', () => {
                    detailsContainer.style.display = 'none';
                    if (correctionContainer.innerHTML) correctionContainer.style.display = 'block';
                    resultsContainer.style.display = 'block';
                });
            }
        });
    </script>
</body>
</html>
